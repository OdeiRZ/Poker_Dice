<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Poker Dice</title>
		<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%B2</text></svg>">
		<meta property="og:title" content="Poker Dice">
		<!--<meta name="description" content="" />
		<meta property="og:description" content="">
		<meta property="og:image" content="img/favicon.ico">-->
		<meta name="keywords" content="poker, dice, odei, game" />
		<meta name="author" content="Odei Riveiro Zafra" />
		<link rel="stylesheet" type="text/css" href="css/main.css" />
		<script type="text/javascript" src="js/funciones.js"></script>
	</head>
	<body>
		<div class="app">
			<header class="app-header">
				<h1>🎲 Poker Dice</h1>
				<p class="subtitle">El clásico juego de dados de póker</p>
				<button type="button" class="btn-ghost" id="btnEscala" aria-expanded="false" aria-controls="panelPuntuacion" onclick="mostrarEscalaPuntuacion()"><span class="btn-icon" aria-hidden="true">📊</span>Ver puntuación</button>
			</header>

			<section class="card config-card" id="panelConfiguracion">
				<div class="config-row" id="panelJugadores">
					<label for="numJugadoresMax">Jugadores</label>
					<select name="numJugadoresMax" id="numJugadoresMax">
						<option value="1" selected>1</option>
						<option value="2">2</option>
						<option value="3">3</option>
						<option value="4">4</option>
					</select>
				</div>
				<div class="config-row config-row-checkbox" id="panelSwPoker">
					<label for="swPoker">Dados de Poker</label>
					<input type="checkbox" id="swPoker" checked>
				</div>
				<p class="config-nota is-hidden" id="notaSwPoker">Los símbolos de póker (7, 8, J, Q, K, As) solo existen en un dado de 6 caras.</p>
				<details class="opciones-avanzadas">
					<summary>Opciones avanzadas</summary>
					<div class="opciones-avanzadas-body">
						<div class="config-row" id="panelDados">
							<label for="numDadosMax">Número de Dados</label>
							<select name="numDadosMax" id="numDadosMax">
								<option value="3">3</option>
								<option value="4">4</option>
								<option value="5" selected>5</option>
								<option value="6">6</option>
							</select>
						</div>
						<div class="config-row" id="panelCarasDado">
							<label for="numCarasDadoMax">Número de Caras</label>
							<select name="numCarasDadoMax" id="numCarasDadoMax">
								<option value="2">2</option>
								<option value="3">3</option>
								<option value="4">4</option>
								<option value="5">5</option>
								<option value="6" selected>6</option>
							</select>
						</div>
						<div class="config-row" id="panelTiradas">
							<label for="numTiradasMax">Número de Tiradas</label>
							<select name="numTiradasMax" id="numTiradasMax">
								<option value="1">1</option>
								<option value="2">2</option>
								<option value="3" selected>3</option>
							</select>
						</div>
					</div>
				</details>
				<div class="config-actions" id="panelBtnInicio">
					<button type="button" id="btnInicio" onclick="comenzarJuego()"><span class="btn-icon" aria-hidden="true">🎮</span>Comenzar Juego</button>
				</div>
			</section>

			<section class="card game-card is-hidden" id="panelJuego">
				<div id="turnoInfo"></div>
				<div id="avisoJuego"></div>
				<div class="game-actions">
					<span id="panelBtnTirada" class="is-hidden">
						<button type="button" id="btnTirada" onclick="realizarTirada()"><span class="btn-icon" aria-hidden="true">🎲</span>Realizar Tirada</button>
					</span>
					<span id="panelBtnFinTiradas"></span>
				</div>
				<div id="tablero" class="tablero"></div>
				<div class="game-actions is-hidden" id="panelBtnFin">
					<button type="button" id="btnFin" onclick="abortarJuego()"><span class="btn-icon" aria-hidden="true">🚪</span>Finalizar Juego</button>
				</div>
			</section>

			<section id="resultados" class="card resultados"></section>

			<section class="card puntuacion-card is-hidden" id="panelPuntuacion"></section>
		</div>
	</body>
</html>
